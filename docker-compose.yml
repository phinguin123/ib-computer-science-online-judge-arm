# ============================================
# Production/Staging Docker Compose
# ============================================
# This file is for Production/Staging environments.
# It pulls pre-built images from Docker Hub.
# Runs on standard web ports (80/443).
# Uses named volumes to avoid conflicts with dev environment.

services:
  # ----------------------------------------
  # 1. REDIS
  # ----------------------------------------
  oj-redis:
    image: redis:6.0-alpine
    restart: always
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    volumes:
      - prod_redis_data:/data
    networks:
      - oj-network

  # ----------------------------------------
  # 2. DATABASE (Postgres)
  # ----------------------------------------
  oj-postgres:
    image: postgres:13-alpine
    restart: always
    environment:
      - POSTGRES_DB=onlinejudge
      - POSTGRES_USER=onlinejudge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks:
      - oj-network

  # ----------------------------------------
  # 3. BACKEND (Django API)
  # ----------------------------------------
  oj-backend:
    image: grow20/onlinejudge-backend:latest
    restart: always
    depends_on:
      - oj-redis
      - oj-postgres
      - oj-judge-server
    volumes:
      - ./data/backend:/data
    environment:
      - POSTGRES_DB=onlinejudge
      - POSTGRES_USER=onlinejudge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=oj-postgres
      - REDIS_HOST=oj-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@oj-redis:6379
      - JUDGE_SERVER_TOKEN=${JUDGE_SERVER_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FORCE_HTTPS=1
    expose:
      - "8000"
    networks:
      - oj-network
    healthcheck:
      test: ["CMD-SHELL", "/app/deploy/healthcheck.sh || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ----------------------------------------
  # 4. FRONTEND (Vue + Nginx)
  # ----------------------------------------
  oj-frontend:
    image: grow20/onlinejudge-frontend:latest
    restart: always
    depends_on:
      oj-backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - oj-network
    volumes:
      - ./ssl:/etc/nginx/ssl:ro  # This assumes 'ssl' is inside the current folder

  # ----------------------------------------
  # 5. JUDGE SERVER
  # ----------------------------------------
  oj-judge-server:
    image: grow20/onlinejudge-judge:latest
    restart: always
    privileged: true
    volumes:
      - ./data/judge_server:/data
      - ./data/backend/test_case:/test_case:ro
    environment:
      - SERVICE_URL=http://oj-judge-server:8080
      - BACKEND_URL=http://oj-backend:8000/api/judge_server_heartbeat/
      - TOKEN=${JUDGE_SERVER_TOKEN}
      - cpu_core=2
    ports:
      - "8080:8080"
    networks:
      - oj-network

# ----------------------------------------
# Named Volumes (Production/Staging)
# ----------------------------------------
# These named volumes ensure data isolation from dev environment
volumes:
  prod_redis_data:
  prod_postgres_data:

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  oj-network: