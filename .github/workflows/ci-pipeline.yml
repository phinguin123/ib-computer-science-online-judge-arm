name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. FIX: Give the robot the missing variables
    env:
      POSTGRES_DB: onlinejudge
      POSTGRES_USER: onlinejudge
      POSTGRES_PASSWORD: test_password
      REDIS_PASSWORD: test_password
      JUDGE_SERVER_TOKEN: test_token
      ADMIN_PASSWORD: admin
      # Force Docker to build for the robot's architecture
      DOCKER_DEFAULT_PLATFORM: linux/amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. FIX: Explicitly build images from scratch FIRST
      # This prevents it from trying to pull your incompatible M1 Mac images
      - name: Build Images from Source
        run: docker compose build

      - name: Start Containers
        run: docker compose up -d

      - name: Wait for Database
        run: sleep 15

      - name: Run Integration Tests
        run: docker compose exec -T oj-backend python manage.py test tests
        
      - name: Stop Containers
        if: always()
        run: docker compose down
