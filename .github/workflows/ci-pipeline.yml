name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Environment variables for testing (Safe to use dummy values here)
    env:
      POSTGRES_DB: onlinejudge
      POSTGRES_USER: onlinejudge
      POSTGRES_PASSWORD: test_password
      REDIS_PASSWORD: test_password
      JUDGE_SERVER_TOKEN: test_token
      ADMIN_PASSWORD: admin
      DOCKER_DEFAULT_PLATFORM: linux/amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # ----------------------------------------------------------------
      # NEW STEP: The "Override" Trick
      # This creates a temporary file that forces Docker to build locally
      # instead of trying to pull the incompatible Mac images from Hub.
      # ----------------------------------------------------------------
      - name: Fix Architecture Mismatch
        run: |
          cat <<EOF > docker-compose.override.yml
          services:
            oj-backend:
              build: ./backend
              image: local-test-backend
            oj-frontend:
              build: ./frontend
              image: local-test-frontend
            oj-judge-server:
              build: ./judge-server
              image: local-test-judge
          EOF

      - name: Start Containers
        # --build forces it to use the new local override settings
        run: docker compose up -d --build

      - name: Wait for Database
        run: sleep 15

      - name: Run Integration Tests
        run: docker compose exec -T oj-backend python manage.py test tests
        
      - name: Stop Containers
        if: always()
        run: docker compose down


      - name: Login to Docker Hub
        # Only run this on main branch, not on random pull requests
        if: github.ref == 'refs/heads/main' && success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Real Images
        if: github.ref == 'refs/heads/main' && success()
        # We remove the override file so it uses the REAL image names (grow20/...)
        run: |
          # 1. Create a "Map" that links Source Code -> Docker Hub Names
          # This tells Docker: "The image 'grow20/...' comes from folder './backend'"
          cat <<EOF > docker-compose.override.yml
          services:
            oj-backend:
              build:
                context: ./backend
              image: grow20/onlinejudge-backend:latest
            oj-frontend:
              build:
                context: ./frontend
              image: grow20/onlinejudge-frontend:latest
            oj-judge-server:
              build:
                context: ./judge-server
              image: grow20/onlinejudge-judge:latest
          EOF

          # 2. Build the images (Now Docker knows where the code is)
          docker compose build

          # 3. Push them (Now Docker knows it owns these images)
          docker compose push