name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Environment variables for testing (Safe to use dummy values here)
    env:
      POSTGRES_DB: onlinejudge
      POSTGRES_USER: onlinejudge
      POSTGRES_PASSWORD: test_password
      REDIS_PASSWORD: test_password
      JUDGE_SERVER_TOKEN: test_token
      ADMIN_PASSWORD: admin
      DOCKER_DEFAULT_PLATFORM: linux/amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # ----------------------------------------------------------------
      # NEW STEP: The "Override" Trick
      # This creates a temporary file that forces Docker to build locally
      # instead of trying to pull the incompatible Mac images from Hub.
      # ----------------------------------------------------------------
      - name: Fix Architecture Mismatch
        run: |
          cat <<EOF > docker-compose.override.yml
          services:
            oj-backend:
              build: ./backend
              image: local-test-backend
            oj-frontend:
              build: ./frontend
              image: local-test-frontend
            oj-judge-server:
              build: ./judge-server
              image: local-test-judge
          EOF

      - name: Start Containers
        # --build forces it to use the new local override settings
        run: docker compose up -d --build

      - name: Wait for Database
        run: sleep 15

      - name: Run Integration Tests
        run: docker compose exec -T oj-backend python manage.py test tests
        
      - name: Stop Containers
        if: always()
        run: docker compose down

      # ----------------------------------------------------------------
      # NEW STEP: Manual Disk Cleanup (Robust & Plugin-Free)
      # We delete large pre-installed tools we don't need.
      # ----------------------------------------------------------------
      - name: Free Disk Space (Manual)
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Delete large directories
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          
          # Clean docker
          docker system prune -af
          
          echo "Disk space after cleanup:"
          df -h

      # ----------------------------------------------------------------
      # PART 2: DEPLOYMENT (The "Universal Delivery")
      # We use 'buildx' to build for BOTH Intel and Apple Silicon
      # ----------------------------------------------------------------
      
      - name: Set up QEMU
        # This allows the Robot to build ARM images on an Intel machine
        if: github.ref == 'refs/heads/main' && success()
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        # This is the "Magic Builder" that handles multi-platform
        if: github.ref == 'refs/heads/main' && success()
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # BUILD BACKEND (Universal)
      - name: Build and Push Backend
        if: github.ref == 'refs/heads/main' && success()
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: grow20/onlinejudge-backend:latest
          # THE MAGIC LINE: Build for both chips
          platforms: linux/amd64,linux/arm64

      # BUILD FRONTEND (Universal)
      - name: Build and Push Frontend
        if: github.ref == 'refs/heads/main' && success()
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: grow20/onlinejudge-frontend:latest
          platforms: linux/amd64,linux/arm64

      # BUILD JUDGE (Universal)
      - name: Build and Push Judge
        if: github.ref == 'refs/heads/main' && success()
        uses: docker/build-push-action@v4
        with:
          context: ./judge-server
          push: true
          tags: grow20/onlinejudge-judge:latest
          platforms: linux/amd64,linux/arm64