# ============================================
# Development Docker Compose
# ============================================
# This file is for active development.
# It builds from local source code.
# Runs on custom ports (8000/8088) to avoid conflicts with Staging.
# Mounts local volumes for hot-reloading.
# Uses separate named volumes for databases to avoid data conflicts.

services:
  # ----------------------------------------
  # 1. REDIS
  # ----------------------------------------
  oj-redis:
    image: redis:6.0-alpine
    restart: always
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    volumes:
      - dev_redis_data:/data
    networks:
      - oj-dev-network

  # ----------------------------------------
  # 2. DATABASE (Postgres)
  # ----------------------------------------
  oj-postgres:
    image: postgres:13-alpine
    restart: always
    environment:
      - POSTGRES_DB=onlinejudge
      - POSTGRES_USER=onlinejudge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - oj-dev-network

  # ----------------------------------------
  # 3. BACKEND (Django API)
  # ----------------------------------------
  oj-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - oj-redis
      - oj-postgres
      - oj-judge-server
    volumes:
      - ./data/backend:/data
      # Mount backend source for hot-reloading
      # Note: This overrides /app, so dist won't be available
      # For frontend changes, rebuild or use the frontend dev service
      - ./backend:/app
    environment:
      - POSTGRES_DB=onlinejudge
      - POSTGRES_USER=onlinejudge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=oj-postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=oj-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@oj-redis:6379
      - JUDGE_SERVER_TOKEN=${JUDGE_SERVER_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FORCE_HTTPS=0
      - OJ_ENV=development
      - DATA_DIR=/data
    ports:
      - "8000:8000"
    networks:
      - oj-dev-network
    entrypoint: python3 manage.py runserver 0.0.0.0:8000

  # ----------------------------------------
  # 4. FRONTEND (Vue.js with Hot-Reloading)
  # ----------------------------------------
  # This service runs the Vue.js dev server for hot-reloading
  # It proxies API requests to the backend container
  # Note: The dev server runs on port 8088 (mapped from container's 8080)
  oj-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    depends_on:
      - oj-backend
    volumes:
      # Mount frontend source for hot-reloading
      - ./frontend:/app
      - /app/node_modules
    environment:
      - TARGET=http://oj-backend:8000
      - PORT=8080
      - NODE_ENV=development
    ports:
      # ✅ Host 8088 -> Container 8080
      - "8088:8080"
    networks:
      - oj-dev-network
    # Use command to run dev server instead of production build
    # Build DLL first (only needed once, but safe to run each time)
    command: > 
      sh -c "git config --global url.'https://github.com/'.insteadOf git@github.com: &&
      git config --global url.'https://github.com/'.insteadOf ssh://git@github.com/ &&
      yarn install &&
      npm run build:dll &&
      npm run dev"

  # ----------------------------------------
  # 5. JUDGE SERVER
  # ----------------------------------------
  oj-judge-server:
    build:
      context: ./judge-server
      dockerfile: Dockerfile
    restart: always
    privileged: true
    volumes:
      - ./data/judge_server:/data
      - ./data/backend/test_case:/test_case:ro
    environment:
      - SERVICE_URL=http://oj-judge-server:8080
      - BACKEND_URL=http://oj-backend:8000/api/judge_server_heartbeat/
      - TOKEN=${JUDGE_SERVER_TOKEN}
      - cpu_core=2
    ports:
      - "8081:8080"
    networks:
      - oj-dev-network

# ----------------------------------------
# Named Volumes (Development)
# ----------------------------------------
# These named volumes ensure data isolation from production/staging
volumes:
  dev_redis_data:
  dev_postgres_data:

# ----------------------------------------
# Networks
# ----------------------------------------
networks:
  oj-dev-network: